      - Rosie Campbell
      - Charles Beasley
      - Bradford Saad
      - Toni Sims
    year: 2026
    type: report
    venue: NYU Center for Mind, Ethics, and Policy and Eleos AI Research
    url: https://nonhumanminds.org/studying-ai-welfare-empirically/
    status: reviewed
    relevance:
