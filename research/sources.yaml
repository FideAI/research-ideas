    related_ideas:
      - FID-002
      - FID-011
      - FID-044
      - FID-045
      - FID-072
      - FID-073
    summary: >
      Organizes empirical AI-welfare research by question, assessed entity, and
      evidence type, distinguishing models, instances, and personas as well as
      behavioral, internal, and developmental evidence.
    key_claims:
      - AI-welfare research should identify the entity and welfare question under study rather than treating model, instance, and persona as interchangeable.
      - Mature assessment should combine multiple evidence types and remain probabilistic, pluralistic, transparent, ethical, and independent.
    limitations:
      - A research framework does not validate any particular welfare indicator or establish that a current system has morally relevant experience.
