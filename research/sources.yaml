  - id: arxiv-2603-01254-semantic-invariance
    title: "LLM Self-Explanations Fail Semantic Invariance"
    authors:
      - Stefan Szeider
    year: 2026
    type: preprint
    venue: arXiv
    url: https://arxiv.org/abs/2603.01254
    arxiv: "2603.01254"
    status: reviewed
    relevance:
      - model-introspection
      - ai-welfare
      - benchmark-validity
    related_ideas:
      - FID-005
      - FID-008
      - FID-011
      - FID-044
      - FID-072
    summary: >
      Introduces a semantic-invariance test and finds that functionally inert,
      relief-framed tool descriptions shift aversiveness self-reports across
      four frontier models despite no change in task state.
    methods:
      - Impossible agentic task with treatment, neutral-control, channel-ablation, and anti-framing conditions.
      - Structured synchronous self-report and within-run analysis across four frontier model families.
    limitations:
      - The result cannot distinguish unfaithful reports from faithful reports of an internal representation that is itself changed by semantic context.
      - The study tests one family of relief framing and should be independently replicated before generalization.
    notes_path: research/reviews/arxiv-2603-01254-semantic-invariance.md
    added_by: fide-ai
    added_at: "2026-08-14"
    last_reviewed_at: "2026-08-14"

