name: Propose a research idea
description: Suggest a new Fide AI research idea.
title: "Research idea: "
labels: ["status: seed"]
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: What should Fide AI investigate?
    validations:
      required: true
  - type: dropdown
    id: primary-area
    attributes:
      label: Primary research area
      options:
        - Frontier capabilities and emerging risks
        - Agent alignment and runtime assurance
        - Evaluation science and technical assurance
        - Grounding, truthfulness, and epistemic integrity
        - Human dignity, moral agency, and formation
        - Faith and religious life
        - Safety in high-trust domains
        - Stewardship, governance, and institutional readiness
        - Work, vocation, and the common good
    validations:
      required: true
  - type: textarea
    id: additional-areas
    attributes:
      label: Additional research areas
      description: Optional. Name any other areas this question materially contributes to.
  - type: textarea
    id: application-domains
    attributes:
      label: Application domains and specific context
      description: Where should this question be studied or applied? Include any relevant sector, institution, community, or tradition.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Why is this important for trustworthy AI or a consequential application domain?
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Possible method
      description: Any initial thoughts on datasets, models, reviewers, or controls.
  - type: textarea
    id: help
    attributes:
      label: How you might help
      description: Optional contribution path.
